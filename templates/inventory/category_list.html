{% extends 'base.html' %} {% block content %}
<div class="d-flex justify-content-between mb-3">
  <h3>Categories</h3>
  <a href="{% url 'category_add' %}" class="btn btn-dark">+ Add</a>
</div>
<table class="table bg-white">
  {% for c in object_list %}
  <tr>
    <td>{{ c.name }}</td>
    <td class="text-end">
      <a href="{% url 'category_edit' c.pk %}">Edit</a> |
      <a href="{% url 'category_delete' c.pk %}" class="text-danger">Delete</a>
    </td>
  </tr>
  {% empty %}
  <tr>
    <td>No categories yet.</td>
  </tr>
  {% endfor %}
</table>
{% endblock %}
