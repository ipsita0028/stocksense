{% extends 'base.html' %} {% block content %}
<div class="d-flex justify-content-between mb-3">
  <h3>Customers</h3>
  <a href="{% url 'customer_add' %}" class="btn btn-dark">+ Add</a>
</div>
<table class="table bg-white">
  <tr>
    <th>Name</th>
    <th>Phone</th>
    <th>Credit Limit</th>
    <th></th>
  </tr>
  {% for c in object_list %}
  <tr>
    <td>{{ c.name }}</td>
    <td>{{ c.phone }}</td>
    <td>{{ c.credit_limit }}</td>
    <td class="text-end">
      <a href="{% url 'customer_edit' c.pk %}">Edit</a> |
      <a href="{% url 'customer_delete' c.pk %}" class="text-danger">Delete</a>
    </td>
  </tr>
  {% empty %}
  <tr>
    <td colspan="4">No customers yet.</td>
  </tr>
  {% endfor %}
</table>
{% endblock %}
